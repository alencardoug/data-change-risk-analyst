services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dcra
      POSTGRES_PASSWORD: dcra
      POSTGRES_DB: dcra
    ports:
      - "5432:5432"
    volumes:
      - dcra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcra -d dcra"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dcra_pgdata:
