services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dcra
      POSTGRES_PASSWORD: dcra
      POSTGRES_DB: dcra
    ports:
      - "5432:5432"
    volumes:
      - dcra_pgdata:/var/lib/postgresql/data
      # simulated warehouse (orders + reporting views) — runs only on a fresh
      # data dir; for an existing volume use `make dw` / deploy/init-db.sh
      - ./deploy/warehouse_schema.sql:/docker-entrypoint-initdb.d/10-warehouse.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcra -d dcra"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dcra_pgdata:
