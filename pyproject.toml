[project]
name = "dcra"
version = "0.1.0"
description = "Data Change Risk Analyst — controlled agentic workflow for assessing risk of data-asset changes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.55",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-core>=0.3.20",
    "langchain-openai>=0.2.10",
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
    "streamlit>=1.40",
    "langsmith>=0.1.140",
    "python-dotenv>=1.0",
    "langchain>=1.0",
    "mcp>=1.2",
    "langchain-mcp-adapters>=0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcra"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "llm: tests that call a real LLM (opt-in via RUN_LLM_TESTS=1)",
]
filterwarnings = [
    "ignore:Deserializing unregistered type:UserWarning",
]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
